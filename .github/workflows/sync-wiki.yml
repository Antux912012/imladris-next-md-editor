name: Sync Documentation to GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Publish docs/wiki to GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Clone GitHub Wiki Repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki_repo

      - name: Sync Markdown Files from docs/wiki/
        run: |
          rsync -av --delete --exclude='.git/' docs/wiki/ wiki_repo/

      - name: Commit and Push Changes to Wiki
        working-directory: wiki_repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to publish to the GitHub Wiki."
          else
            git commit -m "docs(wiki): sync wiki from commit ${GITHUB_SHA::7}"
            git push origin master || git push origin main
          fi
